@let t = language.texts().contact;

<section id="contact" class="contact">
  <div class="contact__text">
    <p class="contact__label">{{ t.label }}</p>
    <h2 class="contact__heading">{{ t.heading }}</h2>
    <h3 class="contact__subheading">{{ t.subheading }}</h3>
    <p class="contact__copy">{{ t.intro }}</p>
    <p class="contact__copy">
      {{ t.question }}
      <a class="contact__cta" [href]="'mailto:' + profile.email">{{ t.cta }}</a>
    </p>
  </div>

  <form class="form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <!-- a required error replaces the placeholder, so showing it never shifts the layout -->
    <label class="field" [class.field--error]="showError('name')">
      <span class="field__label">{{ t.nameLabel }}</span>
      <input
        class="field__input"
        type="text"
        formControlName="name"
        autocomplete="name"
        [placeholder]="showError('name') ? t.nameRequired : t.namePlaceholder"
        [attr.aria-invalid]="showError('name')"
        (focus)="focused.set('name')"
        (blur)="focused.set(null)"
      />
    </label>

    <label class="field" [class.field--error]="showError('email')">
      <span class="field__label">{{ t.emailLabel }}</span>
      <input
        class="field__input"
        type="email"
        formControlName="email"
        autocomplete="email"
        [placeholder]="showError('email') ? t.emailRequired : t.emailPlaceholder"
        [attr.aria-invalid]="showError('email')"
        [attr.aria-describedby]="showError('email') ? 'email-error' : null"
        (focus)="focused.set('email')"
        (blur)="focused.set(null)"
      />
      @if (showError('email') && form.controls.email.hasError('pattern')) {
        <span id="email-error" class="field__error">{{ t.emailInvalid }}</span>
      }
    </label>

    <label class="field" [class.field--error]="showError('message')">
      <span class="field__label">{{ t.messageLabel }}</span>
      <textarea
        class="field__input field__input--message"
        formControlName="message"
        rows="1"
        [placeholder]="showError('message') ? t.messageRequired : t.messagePlaceholder"
        [attr.aria-invalid]="showError('message')"
        (focus)="focused.set('message')"
        (blur)="focused.set(null)"
      ></textarea>
    </label>

    <div class="privacy">
      <label class="privacy__label">
        <input class="privacy__checkbox" type="checkbox" formControlName="privacy" />
        <span>
          {{ t.privacyBefore }}
          <!-- new tab, so a half-filled form isn't lost -->
          <a class="privacy__link" routerLink="/privacy-policy" target="_blank">{{ t.privacyLink }}</a>
          {{ t.privacyAfter }}
        </span>
      </label>
      <!-- line is always reserved so the message doesn't push the button down -->
      <p class="privacy__error" aria-live="polite">
        @if (showError('privacy')) {
          {{ t.privacyRequired }}
        }
      </p>
    </div>

    <button type="submit" class="form__submit" [disabled]="form.invalid">{{ t.submit }}</button>
  </form>
</section>
