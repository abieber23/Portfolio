@let t = language.texts().about;

<section id="about" class="about">
  <div class="about__photo-wrap">
    <img class="about__photo" src="img/skills/profile_img.JPG" [alt]="t.photoAlt" />
  </div>

  <div class="about__text">
    <p class="about__label">{{ t.label }}</p>
    <div class="about__card">
      <h2 class="about__heading">{{ t.heading }}</h2>
      <p class="about__intro">{{ t.intro }}</p>

      <ul class="about__points">
        @for (point of t.points; track $index) {
          <li>
            <img class="about__icon" [src]="'img/skills/about_me_icon_' + ($index + 1) + '.png'" alt="" />
            <span>{{ point }}</span>
          </li>
        }
      </ul>
    </div>
  </div>
</section>
